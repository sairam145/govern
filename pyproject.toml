[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# ---- CHANGE THIS ONE LINE TO RENAME THE PYPI PACKAGE ----
name = "govern-agent"
# ---------------------------------------------------------
version = "0.1.0"
description = "A policy enforcement layer between AI agents and the infrastructure they act on."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sai Ram N." }]
maintainers = [{ name = "Sai Ram N." }]
keywords = [
    "ai-agents", "agents", "governance", "policy", "guardrails",
    "infrastructure", "devops", "sre", "platform-engineering", "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dashboard = ["fastapi>=0.100", "uvicorn>=0.23"]
dev = ["pytest>=7.0", "build>=1.0", "twine>=5.0", "fastapi>=0.100", "uvicorn>=0.23", "httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/sairam145/govern"
Documentation = "https://github.com/sairam145/govern#readme"
Source = "https://github.com/sairam145/govern"
Issues = "https://github.com/sairam145/govern/issues"
Changelog = "https://github.com/sairam145/govern/blob/main/CHANGELOG.md"
[project.scripts]
govern = "govern.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
govern = ["policies/*.yaml", "py.typed", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
